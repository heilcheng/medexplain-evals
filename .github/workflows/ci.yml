name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tests (all model calls are mocked)
        run: cargo test --workspace --locked
      - name: Validate pilot data
        run: cargo run --locked -q -p plainline-cli -- validate-data
      - name: Offline smoke run with the mock client
        run: cargo run --locked -q -p plainline-cli -- run --mock --limit 3 --out runs/ci --boot 100

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the minimum supported Rust version
        run: rustup toolchain install 1.85.0 --profile minimal && rustup default 1.85.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --locked
