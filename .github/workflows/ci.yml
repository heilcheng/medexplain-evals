name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Tests (all model calls are mocked)
        run: pytest -q
      - name: Validate pilot data
        run: plainline validate-data
      - name: Offline smoke run with the mock client
        run: plainline run --mock --limit 3 --out runs/ci --boot 100
