[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "plainline"
version = "0.2.0"
description = "Fidelity under audience adaptation: which safety-critical facts a model drops when it explains a medical source to different readers."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Cheng Hei Lam" }]
keywords = ["medical", "llm", "evaluation", "benchmark", "health-literacy", "inspect-ai"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/heilcheng/plainline"
Repository = "https://github.com/heilcheng/plainline"
Issues = "https://github.com/heilcheng/plainline/issues"
Documentation = "https://github.com/heilcheng/plainline/blob/main/docs/design.md"

[project.optional-dependencies]
inspect = ["inspect_ai>=0.3.100"]
dev = ["pytest>=8.0", "inspect_ai>=0.3.100", "maturin>=1.7,<2.0"]

[project.scripts]
plainline = "plainline.cli:main"

[tool.maturin]
manifest-path = "crates/plainline-py/Cargo.toml"
module-name = "plainline._core"
python-source = "."
python-packages = ["plainline"]
include = [{ path = "plainline/data/readers.yaml", format = ["sdist", "wheel"] }]

[tool.pytest.ini_options]
testpaths = ["tests"]
